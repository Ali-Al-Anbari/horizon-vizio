<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'" />
    <title>Horizon A — minimal input</title>
    <link rel="stylesheet" href="horizon.css" />
    <link rel="stylesheet" href="horizon-minimal.css" />
    <script src="horizon-diagnostics.js" defer></script>
    <script src="horizon-minimal.js" defer></script>
  </head>
  <body>
    <main class="minimal-shell">
      <p class="eyebrow">A / MINIMAL INPUT</p>
      <h1>Remote test</h1>
      <p>Press directions, OK, and Back. Home exits.</p>
      <div id="minimal-key" class="minimal-key" aria-live="polite">Waiting for input</div>
      <p id="minimal-count">0 events</p>
      <div class="minimal-pad" aria-hidden="true">
        <span data-key="ArrowUp">↑</span><span data-key="ArrowLeft">←</span>
        <span data-key="OK">OK</span><span data-key="ArrowRight">→</span>
        <span data-key="ArrowDown">↓</span><span data-key="Back">Back</span>
      </div>
      <aside id="diagnostics" class="diagnostics" aria-label="Performance diagnostics" hidden>
        <span><i id="diag-indicator" class="event-indicator" aria-hidden="true"></i> Key <b id="diag-key">—</b></span>
        <span>Arrived since load <b id="diag-arrival">—</b></span>
        <span>Focus <b id="diag-focus">—</b> ms</span>
        <span>Next frame <b id="diag-frame">—</b> ms</span>
        <span><b id="diag-fps">—</b> FPS</span>
        <span>Long frames <b id="diag-long-frames">0</b></span>
        <span>Pending <b id="diag-pending">0</b></span>
        <span id="diag-memory">Heap n/a</span>
      </aside>
    </main>
  </body>
</html>
