<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon Access test</title>
  <link rel="stylesheet" href="/probe.css">
  <script src="/probe.js" defer></script>
</head>
<body>
  <main>
    <h1>Horizon Access test</h1>
    <p>This page tests sign-in and session retention. It cannot launch apps or control the TV.</p>
    <p id="status" role="status" aria-live="polite">Public test page loaded.</p>
    <div class="actions">
      <a id="sign-in" href="/api/auth/start">Start sign-in</a>
      <button id="check" type="button">Check session</button>
    </div>
    <p class="hint">After sign-in returns here, check the session again. Reload and check once more to test persistence.</p>
  </main>
</body>
</html>
