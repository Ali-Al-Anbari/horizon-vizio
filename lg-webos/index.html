<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horizon Watch</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000000; color: #edf4ff;
      font: 22px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center; }
    .boot { max-width: 680px; padding: 32px; }
    h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: 0.2em; font-weight: 600; }
    p { margin: 0 0 24px; color: #8fa0b5; }
    button { padding: 14px 28px; border-radius: 8px; border: 2px solid #ffffff; background: #ffffff;
      color: #000000; font-size: 20px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main class="boot">
    <h1>HORIZON WATCH</h1>
    <p id="boot-status">Connecting to Horizon Watch…</p>
    <button id="retry-btn" type="button" hidden>Retry Connection</button>
  </main>
  <script>
    (function () {
      var TARGET_URL = "https://horizon-universal-search-preview.ali-al-anbari.workers.dev/?lg=1";
      var statusEl = document.getElementById("boot-status");
      var retryBtn = document.getElementById("retry-btn");

      try {
        if (window.PalmSystem && typeof window.PalmSystem.stageReady === "function") {
          window.PalmSystem.stageReady();
        }
      } catch (_e) {}

      function launchHosted() {
        statusEl.textContent = "Loading Horizon Watch…";
        retryBtn.hidden = true;
        try {
          window.location.replace(TARGET_URL);
        } catch (_err) {
          window.location.href = TARGET_URL;
        }
      }

      retryBtn.addEventListener("click", launchHosted);
      window.addEventListener("keydown", function (ev) {
        var code = ev.keyCode || ev.which;
        if (code === 461 || ev.key === "GoBack") {
          ev.preventDefault();
          return;
        }
        if ((code === 13 || ev.key === "Enter") && !retryBtn.hidden) {
          ev.preventDefault();
          launchHosted();
        }
      });

      if (navigator && navigator.onLine === false) {
        statusEl.textContent = "No TV network connection detected. Check Wi-Fi/Ethernet and press OK to retry.";
        retryBtn.hidden = false;
        retryBtn.focus();
      } else {
        setTimeout(launchHosted, 60);
      }
    })();
  </script>
</body>
</html>
