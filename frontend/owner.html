<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Horizon device approval</title>
  <link rel="stylesheet" href="owner.css">
  <script src="owner.js" defer></script>
</head>
<body>
  <main>
    <h1>Approve a Horizon TV</h1>
    <p>Only approve a code you can see on your own TV. Codes expire after five minutes.</p>
    <label for="code">Code shown on TV</label>
    <input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button id="lookup" type="button">Review TV request</button>
    <section id="review" hidden>
      <h2>Confirm this TV</h2>
      <p id="details"></p>
      <p>The displayed device details are claimed by the TV browser. Verify the code on the physical TV before approving.</p>
      <button id="approve" type="button">Approve this TV</button>
      <button id="reject" type="button">Reject request</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>Approved devices</h2>
    <button id="refresh" type="button">Refresh devices</button>
    <ul id="devices"></ul>
  </main>
</body>
</html>
